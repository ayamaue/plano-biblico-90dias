
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leitura Bíblica – Hoje</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 24px; line-height:1.4; }
    .card { max-width: 720px; margin:auto; border:1px solid #ddd; border-radius:14px; padding:20px; box-shadow: 0 2px 10px rgba(0,0,0,.05); }
    a { text-decoration: none; }
    .links a { display:block; padding:10px 0; }
    .btn { display:inline-block; padding:12px 16px; border-radius:10px; border:1px solid #ddd; }
  </style>
</head>
<body>
  <div class="card">
    <h1>📖 Leitura Bíblica – Hoje</h1>
    <p id="info">Carregando…</p>
    <div class="links" id="links"></div>
    <p><a class="btn" id="openFirst" href="#" target="_self" style="display:none">Abrir primeiro capítulo</a></p>
    <p style="font-size:12px;color:#666">Fonte: Plano bíblico 90 dias (NVI). Início: 2025-08-04. Fuso: America/Sao_Paulo.</p>
  </div>
<script>
async function load() {
  try {
    const res = await fetch('plan_biblico_90dias_feed.json', {cache:'no-store'});
    const FEED = await res.json();
    const tz = "America/Sao_Paulo";
    const now = new Date();
    const fmt = new Intl.DateTimeFormat('en-CA', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit' });
    const parts = fmt.formatToParts(now).reduce((acc, p) => (acc[p.type]=p.value, acc), {});
    const iso = `${parts.year}-${parts.month}-${parts.day}`;
    const entry = FEED.by_date[iso] || FEED.entries[0];
    document.getElementById('info').innerText = `Dia ${entry.day} – ${entry.date} – ${entry.reading}`;
    const linksDiv = document.getElementById('links');
    entry.labels.forEach((label, i) => {
      const a = document.createElement('a');
      a.href = entry.links[i];
      a.innerText = label + " (NVI)";
      a.target = "_self";
      linksDiv.appendChild(a);
    });
    if (entry.links && entry.links.length > 0) {
      const btn = document.getElementById('openFirst');
      btn.style.display = 'inline-block';
      btn.href = entry.links[0];
    }
  } catch (e) {
    document.getElementById('info').innerText = "Não foi possível carregar a leitura de hoje.";
  }
}
load();
</script>
</body>
</html>
